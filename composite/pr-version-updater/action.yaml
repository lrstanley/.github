name: "pr-version-updater"
description: "Wrapper for peter-evans/create-pull-request"
inputs:
  token:
    description: "User-based personal access token"
    required: true
  chore:
    description: "Chore to use for the PR commit"
    required: false
    default: "deps"
  tool:
    description: "Tool to reference when creating the PR"
    required: true
  repo:
    description: "target tools GitHub owner/repo to link to for the given release"
    required: true
  version:
    description: "New version, without v prefix if semver"
    required: true
  previous_version:
    description: "Previous version, without v prefix if semver"
    required: true
  paths:
    description: >-
      A comma or newline-separated list of file paths to commit. Paths should
      follow git's pathspec syntax. Defaults to adding all new and modified files.
    required: true
  base:
    description: >-
      The pull request base branch. Defaults to the branch checked out in the
      workflow.
    required: false
  labels:
    description: "A comma or newline separated list of labels."
    required: false
  delete-branch:
    description: >-
      Delete the branch when closing pull requests, and when undeleted after merging.
      Recommend true.
    default: "true"
  title:
    description: >-
      Pull request title. Defaults to
      "update <tool> from <previous_version> to <version>".
    required: false
  commit-message:
    description: >-
      Commit message. Defaults to
      "chore(<chore>): update <tool> from <previous_version> to <version>".
    required: false
  body:
    description: >-
      Pull request body. Defaults to the generated version bump notes.
      A footer crediting pr-version-updater is always appended.
    required: false
outputs: {}
runs:
  using: "composite"
  steps:
    - name: resolve pull request fields
      id: pr
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        BODY: ${{ inputs.body }}
        DEFAULT_TITLE: "update ${{ inputs.tool }} from ${{ inputs.previous_version }} to ${{ inputs.version }}"
        DEFAULT_COMMIT_MESSAGE: "chore(${{ inputs.chore }}): update ${{ inputs.tool }} from ${{ inputs.previous_version }} to ${{ inputs.version }}"
        DEFAULT_BODY: |
          Updating tool [`${{ inputs.tool }}`](https://github.com/${{ inputs.repo }}):

          - Bumping **version** from [`${{ inputs.previous_version }}`](https://github.com/${{ inputs.repo }}/releases/tag/${{ inputs.previous_version }}) to [`${{ inputs.version }}`](https://github.com/${{ inputs.repo }}/releases/tag/${{ inputs.version }}).

          Release notes: [link](https://github.com/${{ inputs.repo }}/releases/tag/${{ inputs.version }})
        FOOTER: "Pull request auto-generated by [pr-version-updater](https://github.com/lrstanley/.github/blob/master/.github/workflows/composite-pr-version-updater/action.yml)."
      run: |
        set -euo pipefail

        title="${TITLE:-${DEFAULT_TITLE}}"
        commit_message="${COMMIT_MESSAGE:-${DEFAULT_COMMIT_MESSAGE}}"
        body="${BODY:-${DEFAULT_BODY}}"

        while [[ "$body" == *$'\n' ]]; do
          body="${body%$'\n'}"
        done
        body="${body}"$'\n\n'"${FOOTER}"

        delim="PRVU_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'title<<%s\n%s\n%s\n' "$delim" "$title" "$delim"
          printf 'commit_message<<%s\n%s\n%s\n' "$delim" "$commit_message" "$delim"
          printf 'body<<%s\n%s\n%s\n' "$delim" "$body" "$delim"
        } >> "$GITHUB_OUTPUT"
    - name: create pr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.token }}
        add-paths: ${{ inputs.paths }}
        title: ${{ steps.pr.outputs.title }}
        commit-message: ${{ steps.pr.outputs.commit_message }}
        body: ${{ steps.pr.outputs.body }}
        signoff: true
        branch: "chore/version-updater/${{ inputs.tool }}"
        delete-branch: ${{ inputs.delete-branch }}
        base: ${{ inputs.base }}
        labels: "chore,tool-${{ inputs.tool }}${{ inputs.labels && format(',{0}', inputs.labels) }}"
        assignees: "lrstanley"
