name: invoke-task
description: >
  A composite action to invoke a task within a Makefile and Taskfile.yaml files.
inputs:
  task:
    description: >
      The task to run. Can be a comma separated list, if you want to fallback
      to different task names if the first one isn't defined.
    required: true
  fallback:
    description: >
      A fallback run block to run if none of the tasks were defined.
  allow-undefined:
    description: >
      If true, the action will fail if none of the tasks passed into task were defined. This will only apply if `input.fallback` is not set.
    default: "false"
  working-directory:
    description: >
      Working directory to run the task in.
    required: False
    default: .
runs:
  using: "composite"
  steps:
    - uses: lrstanley/.github/composite/install-taskfile@master
    - id: run-task
      name: run-task
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TASKS: ${{ inputs.task }}
      run: |
        if [ "$RUNNER_DEBUG" == "true" ] || [ "$RUNNER_DEBUG" == "1" ]; then
          set -x
        fi
        set +e

        if [ -f "Taskfile.yaml" ]; then
          echo "found Taskfile.yaml"
          # the names and aliases of tasks with a desc, one per line. read into a variable, as piping into
          # "grep -q" lets grep exit before task finishes writing, which pipefail turns into a failed match.
          TASK_NAMES=$(task --list --silent)

          for TASK in ${TASKS//,/ }; do
            if grep -qxF -- "$TASK" <<<"$TASK_NAMES"; then
              echo "running task: $TASK"
              task --exit-code --verbose $TASK || exit 1
              echo "ran=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
        fi

        if [ -f "Makefile" ]; then
          echo "found Makefile"

          for TASK in ${TASKS//,/ }; do
            if make -n $TASK &> /dev/null; then
              echo "running task: $TASK"
              make $TASK || exit 1
              echo "ran=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
        fi

        echo "ran=false" >> "$GITHUB_OUTPUT"
    - if: steps.run-task.outputs.ran == 'false' && inputs.fallback != ''
      name: run-fallback
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -xe
        ${{ inputs.fallback }}
    - if: steps.run-task.outputs.ran == 'false' && inputs.fallback == '' && inputs.allow-undefined == 'false'
      name: fail-if-undefined
      shell: bash
      run: exit 1
