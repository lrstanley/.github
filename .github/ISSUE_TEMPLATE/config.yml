    about: Have a question, or looking for something else? Check here.
    url: "https://github.com/lrstanley/.github/blob/master/.github/SUPPORT.md"
  - name: "💬 Discord chat"
    about: On-topic and off-topic discussions.
    url: "https://liam.sh/chat"
