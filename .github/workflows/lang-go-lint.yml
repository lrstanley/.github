# USAGE:
#   jobs:
#     go-lint:
#       needs: [go-version]
#       uses: lrstanley/.github/.github/workflows/lang-go-lint.yml@master
#       with:
#         go-version: 1.2.3 # or don't provide to use latest Go version.

name: go-lint

on:
  workflow_call:
    inputs:
      go-version:
        description: >
          Go version to use for linting -- defaults to the latest stable Go
          version.
        required: false
        type: string
      codecov:
        description: >
          Enables Codecov integration (requires running tests at least once).
        default: True
        required: False
        type: boolean
      working-directory:
        description: >
          Working directory to run the linting in.
        required: False
        type: string
        default: .

jobs:
  go-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.fetch-versions.outputs.version }}
    steps:
      - uses: lrstanley/.github/composite/go-versions@master
        id: fetch-versions
        with:
          version: ${{ inputs.go-version || 'latest' }}

  codecov:
    needs: [go-version]
    if: ${{ inputs.codecov }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      id-token: write # codecov OIDC upload.
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: lrstanley/.github/composite/install-go@master
        with:
          version: ${{ needs.go-version.outputs.version }}
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: go-prepare,prepare
          allow-undefined: true
          working-directory: ${{ inputs.working-directory }}
      - name: test-with-coverage
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -e
          go test -v -coverprofile=coverage.txt -timeout 3m ./...
      - uses: codecov/codecov-action@v7
        with:
          files: ${{ inputs.working-directory }}/coverage.txt
          # pull requests from forks don't get an OIDC token; those fall back to
          # codecov's tokenless upload for public repositories.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
  golangci-lint:
    needs: [go-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: lrstanley/.github/composite/install-go@master
        with:
          version: ${{ needs.go-version.outputs.version }}
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: go-prepare
          allow-undefined: true
          working-directory: ${{ inputs.working-directory }}
      - uses: lrstanley/.github/composite/golangci-lint@master
        with:
          working-directory: ${{ inputs.working-directory }}
  make:
    needs: [go-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: lrstanley/.github/composite/install-go@master
        with:
          version: ${{ needs.go-version.outputs.version }}
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: go-prepare
          allow-undefined: true
          working-directory: ${{ inputs.working-directory }}
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: go-lint
          allow-undefined: true
          working-directory: ${{ inputs.working-directory }}
