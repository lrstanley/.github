# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# USAGE:
#   jobs:
#     node-lint:
#       uses: lrstanley/.github/.github/workflows/lang-node-lint.yml@master
#       with:
#         node-version: 1.2.3

name: node-lint

on:
  workflow_call:
    inputs:
      node-version:
        description: >
          Node version to use.
        required: false
        default: "lts/*"
        type: string

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: lrstanley/.github/composite/install-node@master
        with:
          version: ${{ inputs.node-version || 'lts/*' }}
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: node-prepare,prepare
          allow-undefined: true
      - uses: lrstanley/.github/composite/invoke-task@master
        with:
          task: node-test,test
          allow-undefined: false
