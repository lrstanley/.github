# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: docker-release

on:
  workflow_call:
    secrets:
      docker-secrets:
        description: "Docker secrets for buildx."
        required: false
      railway-token:
        description: >
          Railway workspace token, for redeploying railway-services after a
          push. Defaults to the caller's RAILWAY_API_TOKEN with `secrets: inherit`.
        required: false
    inputs:
      name:
        description: >
          Name used for the built image (e.g. foo would result in
          ghcr.io/user/foo).
        required: false
        type: string
      dockerfile:
        description: "Alternative dockerfile location."
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Use when you want to change the docker context."
        required: false
        type: string
        default: "."
      build-args:
        description: "Build args to pass to the docker build."
        required: false
        type: string
        default: ""
      push:
        description: "If images should be pushed (not just built and scanned)."
        required: false
        type: boolean
        default: true
      scan:
        description: "If images should be security/quality/etc scanned."
        required: false
        type: boolean
        default: true
      platforms:
        description: "Platforms to build and push (comma-separated list in the, e.g. 'linux/amd64,linux/arm64')."
        required: false
        type: string
        default: "linux/amd64"
      timeout:
        description: "Timeout for the build and push."
        required: false
        type: number
        default: 20
      railway-project:
        description: "Railway project (name or ID) that runs this image."
        required: false
        type: string
        default: ""
      railway-services:
        description: >
          Comma-separated Railway services to redeploy (railway redeploy
          --from-source) when railway-tag is pushed. Empty disables it.
        required: false
        type: string
        default: ""
      railway-tag:
        description: "The image tag the Railway services run, e.g. master or latest."
        required: false
        type: string
        default: "master"
      railway-environment:
        description: "Railway environment to redeploy in."
        required: false
        type: string
        default: "production"
jobs:
  docker-release:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      packages: write
      checks: write
      contents: read
      security-events: write
      statuses: write
    env:
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: v0.76.2
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - run: git fetch --force --tags
      - name: get-latest-tag
        id: get-latest-tag
        run: |
          LATEST=$(git tag --sort=-v:refname | egrep "^v?[0-9]+\.[0-9]+\.[0-9]+$" | head -1)
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
      - if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ inputs.platforms }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: fetch-metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.name || github.event.repository.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,priority=1000,value=latest,enable=${{ github.ref_name == steps.get-latest-tag.outputs.version || !steps.get-latest-tag.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,priority=600,pattern={{major}},enable=${{ github.ref_name == steps.get-latest-tag.outputs.version || !steps.get-latest-tag.outputs.version }}
            type=semver,priority=500,pattern={{major}}.{{minor}}
            type=semver,priority=800,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,priority=700,pattern={{major}}.{{minor}}.{{patch}},suffix=-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.ref_name == steps.get-latest-tag.outputs.version || !steps.get-latest-tag.outputs.version }}
            type=ref,priority=900,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.license=MIT
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=${{ github.event.repository.owner.name }} <${{ github.event.repository.owner.email || 'unknown' }}>
            org.opencontainers.image.name=${{ inputs.name || github.event.repository.name }}
      - name: get-referable-tag
        id: reftag
        run: |
          echo "tag=$(tail -n1 <<< "${{ steps.meta.outputs.tags }}" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: docker-build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          provenance: "mode=max"
          sbom: true
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.docker-secrets }}
          file: ${{ inputs.dockerfile }}
      - name: railway-check
        id: railway-check
        if: inputs.railway-services != '' && inputs.push && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG: ${{ inputs.railway-tag }}
        run: |
          if grep -q -- ":${TAG}\$" <<< "$TAGS"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipping railway redeploy: this run didn't push :${TAG}"
          fi
      - if: steps.railway-check.outputs.deploy == 'true'
        uses: lrstanley/.github/composite/install-railway@master
      - name: railway-redeploy
        if: steps.railway-check.outputs.deploy == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.railway-token || secrets.RAILWAY_API_TOKEN }}
          PROJECT: ${{ inputs.railway-project }}
          ENVIRONMENT: ${{ inputs.railway-environment }}
          SERVICES: ${{ inputs.railway-services }}
        run: |
          set -euo pipefail
          : "${RAILWAY_API_TOKEN:?the railway-token secret (or an inherited RAILWAY_API_TOKEN) is required}" "${PROJECT:?railway-project is required}"
          # --project takes an ID. Resolve a name through the API: `railway list`
          # doesn't accept workspace tokens.
          id="$(railway api --compact '{ projects { edges { node { id name } } } }' \
            | jq -r --arg p "$PROJECT" '.data.projects.edges[].node | select(.name == $p or .id == $p) | .id')"
          [[ -n "$id" && "$id" != *$'\n'* ]] || { echo "no single Railway project matches $PROJECT" >&2; exit 1; }
          IFS=',' read -ra services <<< "$SERVICES"
          for s in "${services[@]}"; do
            s="$(xargs <<< "$s")"
            echo "redeploying $s"
            railway redeploy --project "$id" --environment "$ENVIRONMENT" --service "$s" --from-source --yes
          done
      # the image is only available to scan once it has been pushed (builds
      # aren't loaded into the local docker daemon).
      - name: trivy-scan
        if: github.event_name != 'pull_request' && inputs.scan && inputs.push
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.reftag.outputs.tag }}
          version: ${{ env.TRIVY_VERSION }}
          format: sarif
          output: trivy.sarif
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
      - name: trivy-scan-upload-sarif
        if: github.event_name != 'pull_request' && inputs.scan && inputs.push
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-container
          wait-for-processing: true
